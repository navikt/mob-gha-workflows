name: Build application & build/push image

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        description: Node version to build with
        default: "24"
      project-directory:
        required: false
        type: string
        description: Root directory of the Node.js project (client app), relative to repo root. Use for monorepos where the app is not at repo root.
        default: "."
      server-directory:
        required: false
        type: string
        description: Server directory path
        default: "server"
      server-build-command:
        required: false
        type: string
        description: Command to build the server
        default: "pnpm run build"
      server-prune-dev-deps:
        required: false
        type: string
        description: Command to prune devDependencies from server before building the image
        default: "pnpm install --prod --frozen-lockfile --ignore-scripts"
      app-build-command:
        required: false
        type: string
        description: Command to build the app
        default: "pnpm run build"
      image-tag:
        required: false
        type: string
        description: Docker image tag
        default: "latest"
      image-suffix:
        required: false
        type: string
        description: Suffix to append to the image tag
        default: ""
      docker-context:
        required: false
        type: string
        description: Path to the Docker build context
        default: "."
      dockerfile:
        required: false
        type: string
        description: Path to the Dockerfile
        default: "Dockerfile"
      has-vitest:
        required: false
        type: boolean
        description: Whether the project has Vitest configured
        default: false
      vitest-command:
        required: false
        type: string
        description: Command to run Vitest tests
        default: "pnpm run vitest"
      has-playwright:
        required: false
        type: boolean
        description: Whether the project has Playwright configured
        default: false
      playwright-command:
        required: false
        type: string
        description: Command to run Playwright tests
        default: "pnpm run playwright"
    secrets:
      ASTRO_KEY:
        required: false
        description: Optional Astro key

    outputs:
      image:
        description: Google Artifact Registry image
        value: ${{ jobs.build-application-build-push-image.outputs.image }}

jobs:
  build-application-build-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6.0.10
        with:
          run_install: false
          package_json_file: ${{ inputs.project-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          cache-dependency-path: ${{ inputs.project-directory }}/pnpm-lock.yaml

      - name: Set up pnpm authentication and config
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          pnpm config set engineStrict true
          pnpm config set ignoreScripts true
          pnpm config set minimumReleaseAge 10080
          pnpm config set @navikt:registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }} # zizmor: ignore[secrets-outside-env] reusable workflow consumes caller-provided org/environment secret

      - name: Resolve directories
        id: dirs
        run: |
          PROJECT_DIR="${{ inputs.project-directory }}"
          SERVER_SUBDIR="${{ inputs.server-directory }}"
          if [ "$PROJECT_DIR" = "." ]; then
            SERVER_DIR="$SERVER_SUBDIR"
          else
            SERVER_DIR="$PROJECT_DIR/$SERVER_SUBDIR"
          fi
          echo "project-dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "server-dir=$SERVER_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies for client
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: pnpm install --frozen-lockfile

      - name: Install dependencies for server
        if: ${{ hashFiles(format('{0}/package.json', steps.dirs.outputs.server-dir)) != '' }}
        working-directory: ${{ steps.dirs.outputs.server-dir }}
        run: pnpm install --frozen-lockfile

      - name: Verify package signatures (client)
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: pnpm audit signatures
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }} # zizmor: ignore[secrets-outside-env] reusable workflow consumes caller-provided org/environment secret

      - name: Verify package signatures (server)
        if: ${{ hashFiles(format('{0}/package.json', steps.dirs.outputs.server-dir)) != '' }}
        working-directory: ${{ steps.dirs.outputs.server-dir }}
        run: pnpm audit signatures
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }} # zizmor: ignore[secrets-outside-env] reusable workflow consumes caller-provided org/environment secret

      - name: Cache Playwright browsers
        if: ${{ inputs.has-playwright }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/pnpm-lock.yaml', steps.dirs.outputs.project-dir)) }}

      - name: Install Playwright browsers (if cache miss)
        if: ${{ inputs.has-playwright && steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright
        if: ${{ inputs.has-playwright }}
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: $PLAYWRIGHT_COMMAND
        env:
          PLAYWRIGHT_COMMAND: ${{ inputs.playwright-command }}

      - name: Run Vitest
        if: ${{ inputs.has-vitest }}
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: $VITEST_COMMAND
        env:
          VITEST_COMMAND: ${{ inputs.vitest-command }}

      - name: Build server
        if: ${{ hashFiles(format('{0}/package.json', steps.dirs.outputs.server-dir)) != '' }}
        working-directory: ${{ steps.dirs.outputs.server-dir }}
        run: $SERVER_BUILD_COMMAND
        env:
          SERVER_BUILD_COMMAND: ${{ inputs.server-build-command }}

      - name: Build app
        working-directory: ${{ steps.dirs.outputs.project-dir }}
        run: $APP_BUILD_COMMAND
        env:
          APP_BUILD_COMMAND: ${{ inputs.app-build-command }}
          ASTRO_KEY: ${{ secrets.ASTRO_KEY }} # zizmor: ignore[secrets-outside-env] reusable workflow consumes caller-provided org/environment secret

      - name: Prune devDependencies (server) for production image
        if: ${{ hashFiles(format('{0}/package.json', steps.dirs.outputs.server-dir)) != '' }}
        working-directory: ${{ steps.dirs.outputs.server-dir }}
        run: $SERVER_PRUNE_COMMAND
        env:
          SERVER_PRUNE_COMMAND: ${{ inputs.server-prune-dev-deps }}
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }} # zizmor: ignore[secrets-outside-env] reusable workflow consumes caller-provided org/environment secret

      - name: Push Docker Image to GAR
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: okonomi
          dockerfile: ${{ inputs.dockerfile }}
          docker_context: ${{ inputs.docker-context }}
          image_suffix: ${{ inputs.image-suffix }}
          tag: ${{ inputs.image-tag }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
