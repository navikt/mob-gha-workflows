name: CodeQL Scan

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: "Programming language to analyze (eg: java or javascript)"
      project-directory:
        required: false
        type: string
        description: Root directory of the project to build, relative to repo root. Use for monorepos where the build is not at repo root. Only relevant for compiled languages (kotlin, java, java-kotlin).
        default: "."
      build-command:
        required: false
        type: string
        description: Build command to run for compiled languages when project-directory is not repo root. Ignored for languages that use autobuild (project-directory == ".") or that don't require a build (eg. javascript).
        default: "./gradlew build -x test --configuration-cache"

jobs:
  codeql-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ${{ inputs.language }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        if: ${{ contains(fromJSON('["kotlin","java-kotlin","java"]'), inputs.language) && inputs.project-directory != '.' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # ratchet:github/codeql-action/init@v4.38.2
        with:
          tools: linked
          languages: ${{ matrix.language }}
          build-mode: ${{ contains(fromJSON('["kotlin","java-kotlin","java"]'), inputs.language) && (inputs.project-directory == '.' && 'autobuild' || 'manual') || 'none' }}
          queries: security-and-quality

      - name: Build (monorepo project-directory)
        if: ${{ contains(fromJSON('["kotlin","java-kotlin","java"]'), inputs.language) && inputs.project-directory != '.' }}
        working-directory: ${{ inputs.project-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: $BUILD_COMMAND

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # ratchet:github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
