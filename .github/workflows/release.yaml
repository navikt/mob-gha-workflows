name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${REF_NAME}"^ 2>/dev/null || true)
          ARGS=(--title "${REF_NAME}" --generate-notes --verify-tag)
          if [ -n "${PREVIOUS_TAG}" ]; then
            ARGS+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          gh release create "${REF_NAME}" "${ARGS[@]}"

      - name: Update major version tag
        env:
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR=$(echo "${REF_NAME}" | grep -oE '^v[0-9]+')
          SHA=$(git rev-parse HEAD)

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR}" \
            --field sha="${SHA}" \
            --field force=true 2>/dev/null || \
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/${MAJOR}" \
            --field sha="${SHA}"
