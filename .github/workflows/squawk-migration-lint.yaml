name: Squawk Migration Lint

on:
  workflow_call:

jobs:
  squawk-migration-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find modified migrations
        run: |
          modified_migrations=$(git diff --diff-filter=d --name-only origin/$GITHUB_BASE_REF...origin/$GITHUB_HEAD_REF 'src/main/resources/db/migration/*.sql' | tr '\n' ' ')
          echo "Migration files: $modified_migrations"
          echo "file_names=$modified_migrations" >> $GITHUB_OUTPUT
        id: modified-migrations

      - name: Run Squawk Lint
        uses: sbdchd/squawk-action@f972c01c35289cf7611464dae9a214bb84cce5e4 # ratchet:sbdchd/squawk-action@v2.2.0
        with:
          files: ${{ steps.modified-migrations.outputs.file_names }}
