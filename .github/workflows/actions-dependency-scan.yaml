name: Actions Dependencies Scan

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "CODEOWNERS"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "CODEOWNERS"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  actions-dependencies-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Submit Actions dependencies
        uses: jessehouwing/actions-dependency-submission@811981eec3c108f41783f194522fde91a34301a4 # ratchet:jessehouwing/actions-dependency-submission@v2.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  action-dependencies-review:
    if: github.event_name == 'pull_request'
    needs: actions-dependencies-submit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # ratchet:actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          warn-only: false
